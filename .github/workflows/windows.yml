name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Time zone data
        run: python -m pip install tzdata
      - name: Collector tests
        env:
          PYTHONPATH: source/collector
        run: python -m unittest discover -s source/collector/tests

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check main.js
        run: |
          node --check source/electron/main.js
          node --check source/electron/preload.js
      - name: Build the portable zip
        run: python scripts/package-windows.py
      - name: Bundled Python loads the collector
        shell: pwsh
        run: |
          dist\SuperBerry-windows-x64\python\python.exe -c "import sqlite3, ssl, zoneinfo, streamdonations.server; zoneinfo.ZoneInfo('America/Los_Angeles'), streamdonations.kick_sig, streamdonations.youtube_quota; print('collector ok')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SuperBerry-windows-x64
          path: dist/SuperBerry-windows-x64.zip
          if-no-files-found: error
          # Builds of main and tags are kept 14 days; pull requests and other branches 1 day.
          retention-days: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 14 || 1 }}
