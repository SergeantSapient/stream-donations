[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-donations"
version = "1.0.0"
description = "Collect YouTube, Rumble, and Kick donation events into a local ledger."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stream-donations = "streamdonations.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamdonations*"]

[tool.setuptools.package-data]
streamdonations = ["web/*"]
